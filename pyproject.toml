[project]
name = "jsoncanon"
version = "0.2.3"
description = "Typed Python implementation of JSON Canonicalization Scheme as described in RFC 8785. Currently lacks full floating point support"
license = "Apache-2.0"
authors = [{name = "Sveinung Gundersen", email = "sveinugu@gmail.com"}]
readme = "README.md"
keywords = ["JSON", "RFC-8785", "canonicalization", "deterministic", "serialization", "hash"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3.10", "Topic :: Software Development :: Libraries"]
requires-python = ">=3.10,<4.0"
dependencies = []

[project.urls]
repository = "https://github.com/sveinugu/jsoncanon"

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10",
    "pytest-pycharm>=0.7.0,<0.8",
    "ruff>=0.16.0,<0.17",
    "prek>=0.2.0,<1",
    "mypy>=2.3.0,<3",
    "pyright>=1.1.400,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsoncanon"]

[tool.ruff]
line-length = 100
src = ["src/jsoncanon", "tests"]
extend-exclude = ["tests/json-canonicalization"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "Q"]
ignore = ["E721"]
mccabe = {max-complexity = 10}

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src/jsoncanon", "tests"]
exclude = ["tests/json-canonicalization"]
typeCheckingMode = "strict"

[tool.mypy]
strict = true
exclude = ["tests/json-canonicalization"]
