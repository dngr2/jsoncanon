[project]
name = "jsoncanon"
version = "0.2.3"
description = "Typed Python implementation of JSON Canonicalization Scheme as described in RFC 8785. Currently lacks full floating point support"
license = "Apache-2.0"
authors = [{name = "Sveinung Gundersen", email = "sveinugu@gmail.com"}]
readme = "README.md"
keywords = ["JSON", "RFC-8785", "canonicalization", "deterministic", "serialization", "hash"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3.10", "Topic :: Software Development :: Libraries"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "toml>=0.10.2",
]

[project.urls]
repository = "https://github.com/sveinugu/jsoncanon"

[dependency-groups]
dev = [
    "pytest>=7.1.0,<8",
    "pytest-pycharm>=0.7.0,<0.8",
    "yapf>=0.43.0,<0.44",
    "flake8>=4.0.1,<5",
    "isort>=5.10.1,<6",
    "flake8-quotes>=3.3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsoncanon"]

[tool.yapf]
based_on_style = "google"
align_closing_bracket_with_visual_indent = true
blank_line_before_nested_class_or_def = false
column_limit = 100
indent_dictionary_value = true
join_multiple_lines = true
split_all_comma_separated_values = false
split_all_top_level_comma_separated_values = true
split_before_expression_after_opening_paren = true
split_before_arithmetic_operator = true

[tool.isort]
profile = "google"
force_single_line = false
multi_line_output = 1
src_paths = ["src/jsoncanon", "tests"]
line_length = 100
